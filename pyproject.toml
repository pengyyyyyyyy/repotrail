[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repotrail"
version = "0.2.0"
description = "Self-hosted team onboarding grounded in Python source and project knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "keyring>=25,<26",
    "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
    "pypdf>=5,<7", "python-multipart>=0.0.20,<1", "cryptography>=44,<51",
    "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
embeddings = ["fastembed>=0.7,<1"]

[project.scripts]
repotrail = "repotrail.cli:main"

[tool.setuptools.package-data]
repotrail = ["static/*", "sample/*.py", "sample/README.md", "sample/knowledge/*.md"]

[tool.setuptools.packages.find]
include = ["repotrail*"]
exclude = ["repotrail.sample*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


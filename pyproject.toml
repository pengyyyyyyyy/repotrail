[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repotrail"
version = "0.1.0"
description = "Source-grounded reading trails for unfamiliar Python repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
repotrail = "repotrail.cli:main"

[tool.setuptools.package-data]
repotrail = ["static/*", "sample/*.py", "sample/README.md"]

[tool.setuptools.packages.find]
include = ["repotrail*"]
exclude = ["repotrail.sample*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


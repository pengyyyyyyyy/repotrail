<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f8">
  <title>RepoTrail · 源码阅读工作区</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="RepoTrail 首页"><span class="brand-mark" aria-hidden="true"></span>RepoTrail</a>
    <span class="workspace-label">源码阅读工作区</span>
    <div class="top-actions">
      <span id="model-status" class="meta">检查模型配置</span>
      <button id="open-repository" class="button primary">打开仓库 <span aria-hidden="true">↗</span></button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="仓库导航">
      <div class="repo-identity">
        <div class="repo-avatar" aria-hidden="true">/</div>
        <div><div id="repo-name" class="repo-name">载入示例</div><div id="repo-revision" class="meta mono">源码快照</div></div>
      </div>
      <div class="sidebar-section">
        <h2>候选流程 <span id="flow-count" class="meta mono"></span></h2>
        <div id="flows" class="flows"></div>
        <button id="generate" class="button generate" disabled>生成所选导览 <span aria-hidden="true">→</span></button>
      </div>
      <div class="sidebar-section modules-section">
        <h2>模块地图 <span id="file-count" class="meta mono"></span></h2>
        <div id="modules" class="modules"></div>
      </div>
      <div class="sidebar-foot">
        <button id="load-demo" class="text-button">打开离线示例</button>
        <p>基于源码快照阅读<br>静态关系仍需结合运行行为核对</p>
      </div>
    </aside>

    <main>
      <div class="breadcrumb"><span>工作区</span><span aria-hidden="true">/</span><span id="breadcrumb-repo">Paperplane</span><span aria-hidden="true">/</span><span>阅读路线</span></div>
      <section class="page-heading">
        <div><div id="mode-label" class="mode-label">离线示例 · 未调用模型</div><h1 id="trail-title">正在载入源码导览</h1><p id="trail-summary" class="summary"></p></div>
        <div class="export-control">
          <button id="export-button" class="button secondary" aria-expanded="false" aria-controls="export-menu" disabled>导出导览 <span aria-hidden="true">↓</span></button>
          <div id="export-menu" class="export-menu" hidden>
            <a id="export-markdown" download>Markdown</a>
            <a id="export-codetour" download>CodeTour</a>
            <a id="export-json" download>JSON</a>
          </div>
        </div>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="error" class="error" role="alert" hidden></div>

      <section id="overview" class="overview" aria-label="仓库概览"></section>

      <div id="reading-workspace" class="reading-workspace">
        <section class="trail-panel" aria-label="阅读步骤">
          <div class="section-heading"><h2>阅读路线</h2><span id="step-count" class="meta mono"></span></div>
          <div id="steps" class="steps"></div>
          <div id="step-details" class="step-details"></div>
          <div class="step-navigation">
            <button id="previous" class="button secondary" disabled>← 上一步</button>
            <button id="next" class="button secondary" disabled>下一步 →</button>
          </div>
        </section>
        <section class="source-panel" aria-label="源码对照">
          <div class="source-heading"><span id="source-file" class="mono">源码</span><span id="source-range" class="mono"></span></div>
          <div id="source" class="source-code" tabindex="0" aria-label="选中步骤的源码"></div>
          <div class="source-footer"><span id="source-status">等待选择步骤</span><span id="snapshot-hash" class="mono"></span></div>
        </section>
      </div>

      <section class="review-section">
        <div class="review-heading"><h2>证据与待核实部分</h2><span class="meta">说明语义需要人工核对</span></div>
        <div id="validation" class="validation"></div>
        <ul id="gaps" class="gaps"></ul>
      </section>
      <footer class="page-footer"><span>RepoTrail · 从入口到实现</span><span id="run-metrics" class="mono"></span></footer>
    </main>
  </div>

  <dialog id="repository-dialog">
    <form id="repository-form">
      <div class="dialog-heading"><h2>打开 Python 仓库</h2><button type="button" id="close-dialog" class="close-button" aria-label="关闭">×</button></div>
      <label for="repository-source">GitHub URL 或本地克隆目录</label>
      <input id="repository-source" name="source" placeholder="https://github.com/owner/repo" required autocomplete="off" spellcheck="false">
      <p>支持公开仓库，最多 300 个 Python 文件、单文件 200 KB、源码共 4 MB。读取源码并建立快照。</p>
      <p id="dialog-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" id="cancel-dialog" class="button secondary">取消</button><button type="submit" id="analyze-button" class="button primary">分析仓库 →</button></div>
    </form>
  </dialog>
</body>
</html>
